[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "remote"
version = "0.1.0"
description = "Smart TV remote control app"
requires-python = ">=3.11"
dependencies = [
    "pyvizio>=0.1.60",
    "pywebview>=5.0",
]

[project.scripts]
tv-app = "remote.app:run"

[tool.setuptools.packages.find]
where = ["src"]
